<link rel="stylesheet" th:href="@{/css/register.css}" />

<div class="register-page">
  <div class="register-card">
    <h2>Create an account</h2>
    <form action="/saveMember" method="post" class="register-form">
      <div class="row">
        <label for="id">ID</label>
        <input id="id" name="id" placeholder="ID" required />
      </div>
      <div class="row">
        <label for="name">Name</label>
        <input id="name" name="name" placeholder="Full name" required />
      </div>
      <div class="row two-cols">
        <div>
          <label for="age">Age</label>
          <input id="age" name="age" placeholder="Age" required />
        </div>
        <div>
          <label for="plan">Plan</label>
          <input id="plan" name="plan" placeholder="Plan (e.g. monthly)" required />
        </div>
      </div>
      <div class="row">
        <label for="username">Username</label>
        <input id="username" name="username" placeholder="Username" required />
      </div>
      <div class="row">
        <label for="password">Password</label>
        <input id="password" name="password" placeholder="Password" type="password" required />
      </div>
      <div class="row actions">
        <button type="submit" class="btn-primary">Register</button>
        <a href="/login" class="btn-link">Already have an account?</a>
      </div>
    </form>
  </div>
</div>

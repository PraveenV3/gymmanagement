<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Member</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body class="container mt-5">
    <h2>Edit Member</h2>
    <form action="/updateMember" method="post">
        <input type="hidden" name="id" th:value="${member.id}" />
        <div class="mb-2">
            <input name="name" placeholder="Name" class="form-control" th:value="${member.name}" required>
        </div>
        <div class="mb-2">
            <input name="age" placeholder="Age" class="form-control" th:value="${member.age}" required>
        </div>
        <div class="mb-2">
            <input name="plan" placeholder="Plan" class="form-control" th:value="${member.plan}" required>
        </div>
        <div class="mb-2">
            <input name="username" placeholder="Username" class="form-control" th:value="${member.username}" required>
        </div>
        <div class="mb-2">
            <input name="password" placeholder="Password" type="password" class="form-control" th:value="${member.password}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/members" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trainers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2>Trainer List</h2>

<a href="/addTrainer" class="btn btn-primary mb-3">Add Trainer</a>

<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Specialty</th>
        <th>Experience</th>
        <th>Actions</th>
    </tr>

    <tr th:each="t : ${trainers}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.name}"></td>
        <td th:text="${t.specialty}"></td>
        <td th:text="${t.experience}"></td>
        <td>
            <a th:href="@{/editTrainer(id=${t.id})}" class="btn btn-warning">Edit</a>
            <a th:href="@{/deleteTrainer(id=${t.id})}" class="btn btn-danger"
               onclick="return confirm('Delete?')">Delete</a>
        </td>
    </tr>

</table>

</body>
</html>

<!— Include custom stylesheet for members page —>
<link rel="stylesheet" th:href="@{/css/members.css}" />

<div class="members-page">
    <header class="members-header">
        <h1>Members</h1>
        <div class="actions">
            <a href="/register" class="btn btn-primary">Add Member</a>
            <a th:href="@{/logout}" class="btn btn-logout">Logout</a>
            <input id="memberSearch" type="search" placeholder="Search members..." aria-label="Search" />
        </div>
    </header>

    <div class="table-wrap">
        <table class="members-table table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Plan</th>
                <th>Username</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${members}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.name}"></td>
                <td th:text="${m.age}"></td>
                <td th:text="${m.plan}"></td>
                <td th:text="${m.username}"></td>
                <td class="actions-cell">
                    <a th:href="@{/edit/{id}(id=${m.id})}" class="btn btn-edit">Edit</a>
                    <a th:href="@{/delete/{id}(id=${m.id})}" class="btn btn-delete" onclick="return confirm('Are you sure you want to delete this member?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Simple client-side search (filters rows by text in any column)
    (function(){
        const input = document.getElementById('memberSearch');
        if(!input) return;
        input.addEventListener('input', function(){
            const q = this.value.trim().toLowerCase();
            const rows = document.querySelectorAll('.members-table tbody tr');
            rows.forEach(r => {
                const text = r.innerText.toLowerCase();
                r.style.display = q === '' || text.indexOf(q) !== -1 ? '' : 'none';
            });
        });
    })();
</script>
